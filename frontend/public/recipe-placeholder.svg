  <circle cx="200" cy="130" r="80" fill="#fde68a" opacity="0.4"/>
  <circle cx="200" cy="130" r="60" fill="#fbbf24" opacity="0.3"/>
  <!-- Fork -->
  <line x1="160" y1="80" x2="160" y2="180" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <line x1="152" y1="80" x2="152" y2="110" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="80" x2="160" y2="110" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <line x1="168" y1="80" x2="168" y2="110" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <!-- Knife -->
